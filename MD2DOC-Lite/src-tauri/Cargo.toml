[package]
name = "md2doc-lite"
version = "0.1.0"
description = "A lightweight Markdown to DOCX desktop converter."
authors = ["EricHuang"]
edition = "2021"

[lib]
name = "md2doc_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
